# Ghost-Intel CI — offline unit tests on every push/PR (no network).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The engine is stdlib-only and compatible down to 3.8 (verified on
        # 3.8.10 locally). ubuntu-latest (26.04) provisions 3.10-3.15, so the
        # matrix targets those; add "3.8"/"3.9" back on a self-hosted runner
        # if you need to pin the oldest supported interpreter.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
