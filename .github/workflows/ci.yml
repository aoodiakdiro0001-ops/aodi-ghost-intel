# Ghost-Intel CI — offline unit tests on every push/PR (no network).
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The engine is stdlib-only and compatible down to 3.8 (verified on
        # 3.8.10 locally). The matrix uses versions installable on the runner;
        # add "3.8" back only if your self-hosted runner provides it.
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline test suite
        run: python -m unittest discover -s tests -v
