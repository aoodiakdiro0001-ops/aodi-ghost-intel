# Publish the Ghost-Intel dashboard to GitHub Pages (free static hosting).
#
# The dashboard is a single self-contained HTML file rendered from the store.
# This workflow rebuilds it on a schedule + on demand, then deploys the docs/
# folder to GitHub Pages so it's live at:
#   https://<owner>.github.io/<repo>/
#
# Enable Pages once: Settings -> Pages -> Source = "GitHub Actions".
# If your target list or stored text is sensitive, keep the repo PRIVATE and
# serve the dashboard from a private host instead (Pages needs a public repo).

name: pages

on:
  schedule:
    - cron: "41 */4 * * *"   # rebuild every 4h (just after the scan at :23)
  workflow_dispatch:

permissions:
  contents: write   # to commit the refreshed store back
  pages: write      # to deploy to Pages
  id-token: write   # for the Pages deploy action

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GHOST_DB: ghost-intel.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Init store (+ committed targets)
        run: python -m ghost_intel.cli init --sample examples/targets.json || true

      - name: Crawl politely
        run: python -m ghost_intel.cli scan

      - name: Render dashboard to docs/
        run: python -m ghost_intel.cli dashboard --out docs/index.html

      - name: Persist store
        run: |
          git config user.name "ghost-intel-bot"
          git config user.email "ghost-intel@users.noreply.github.com"
          git add -f ghost-intel.db docs/index.html || true
          git commit -m "ghost: dashboard $(date -u +%FT%TZ)" || true
          git pull --rebase --autostash || true
          git push || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
